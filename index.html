:root[data-theme="dark"]{--paper:#0f1626;--sheet:#172036;--ink:#e7ecf7;--ink-soft:#a3aec6;--line:#2a3550;--accent:#86a6ff;--accent-soft:#1f2d52;--on-accent:#0d1530;--good:#55d090;--good-soft:#15392a;--bad:#ff857a;--bad-soft:#3d1d1d;--warn:#ffcf5a;--warn-soft:#3a2f10;--star:#ffc93d; color-scheme:dark}

 tốt câu hỏi trong các bài khoa học.", "Tiếp thu bài tốt, nắm vững kiến thức, có kĩ năng làm thí nghiệm khoa học.", "Thích tìm tòi, khám phá, ghi nhớ tốt các kiến thức khoa học."], "8": ["Học khá, biết vận dụng các kiến thức khoa học vào thực tiễn.", "Nắm được kiến thức khoa học cơ bản và biết vận dụng kiến thức vào cuộc sống.", "Nắm được kiến thức, kĩ năng làm thí nghiệm khoa học cơ bản."], "7": ["Biết làm thí nghiệm đơn giản, biết vận dụng kiến thức vào cuộc sống.", "Nắm được kiến thức, kỹ năng cơ bản của môn học."], "6": ["Nắm được kiến thức kĩ năng của môn học nhưng cần tích cực hơn.", "Cần vận dụng kiến thức đã học vào thực tiễn nhiều hơn."], "5": ["Cần tích cực chủ động trong học tập hơn."], "<5": ["Chưa hoàn thành kiến thức kĩ năng của môn học."]}, "Lịch sử và Địa lí": {"10": ["Tích cực tham gia xây dựng bài học, ghi nhớ kiến thức về lịch sử, địa lí rất tốt.", "Tiếp thu nhanh, nắm chắc các kiến thức lịch sử, địa lí đã học.", "Chủ động tìm hiểu về lịch sử, địa lí Việt Nam và ghi nhớ kiến thức tốt.", "Tích cực, chủ động tiếp thu kiến thức và biết liên hệ thực tế từ bài học.", "Tự giác trong học tập, có hiểu biết tốt về lịch sử và địa lí Việt Nam."], "9": ["Tích cực, chủ động khi tham gia tìm hiểu kiến thức lịch sử và địa lí.", "Nắm vững kiến thức lịch sử, địa lí đã học và biết liên hệ trả lời câu hỏi của bài học.", "Chăm học hỏi và ghi nhớ tốt các kiến thức lịch sử, địa lí đã học.", "Tiếp thu bài tốt, vận dụng tốt kiến thức lịch sử, địa lí vào cuộc sống.", "Có ý thức học tập tốt, tích cực tham gia các hoạt động tìm hiểu nội dung bài học."], "8": ["Học khá, nắm được các kiến thức lịch sử và địa lí đã học.", "Học khá, biết vận dụng các kiến thức lịch sử và địa lí vào cuộc sống"], "7": ["Nắm được kiến thức, kỹ năng cơ bản của môn học."], "6": ["Nắm được kiến thức kĩ năng của môn học nhưng cần tích cực hơn.", "Cần vận dụng kiến thức đã học vào thực tiễn nhiều hơn."], "5": ["Cần tích cực chủ động trong học tập hơn."], "<5": ["Chưa hoàn thành kiến thức kĩ năng của môn học."]}, "Tin học và Công nghệ": {"10": ["Hiểu bài, vận dụng tốt các kiến thức đã học vào cuộc sống.", "Tiếp thu nhanh, vận dụng tốt các kiến thức đã học vào cuộc sống.", "Hăng hái phát biểu xây dựng bài, chủ động nắm bắt và ghi nhớ kiến thức tốt.", "Tích cực, chủ động tiếp thu bài học và vận dụng thực hành tốt.", "Tiếp thu bài tốt, vận dụng tốt các kiến thức đã học vào thực hành."], "9": ["Nắm vững kiến thức đã học và trả lời đúng các câu hỏi của bài học.", "Nắm vững kiến thức đã học và tích cực hoàn thành sản phẩm công nghệ.", "Chăm học, vận dụng tốt các kiến thức đã học vào cuộc sống.", "Chăm học, ghi nhớ kiến thức tốt, biết liên hệ thực tế từ bài học.", "Chủ động trong học tập, vận dụng tốt kiến thức và thực tiễn."], "8": ["Học khá, nắm được kiến thức, kĩ năng của môn học.", "Học khá, biết vận dụng kiến thức đã học vào thực tiễn.", "Học khá, biết vận dụng kiến thức đã học vào thực hành."], "7": ["Nắm được kiến thức, kỹ năng cơ bản của môn học."], "6": ["Nắm được kiến thức kĩ năng của môn học nhưng cần tích cực hơn.", "Cần vận dụng kiến thức đã học vào thực tiễn nhiều hơn."], "5": ["Cần tích cực chủ động trong học tập hơn."], "<5": ["Chưa hoàn thành kiến thức kĩ năng của môn học."]}, "Hoạt động trải nghiệm": {"T": ["Tích cực trong học tập, vận dụng tốt kiến thức vào thực tiễn.", "Tự giác học tập, vận dụng tốt kiến thức đã học vào thực hành.", "Chủ động trong học tập, vận dụng tốt kiến thức vào cuộc sống.", "Tích cực phát biểu và tham gia các hoạt động trải nghiệm.", "Tích cực tham gia xây dựng bài học và vận dụng kiến thức vào thực tiễn.", "Hiểu bài, vận dụng tốt các kiến thức đã học vào cuộc sống.", "Nắm vững kiến thức đã học và vận dụng thực hành tốt.", "Tích cực phát biểu, chủ động tham gia các hoạt động trải nghiệm.", "Ghi nhớ kiến thức tốt và tích cực tham gia các hoạt động trải nghiệm.", "Tham gia tích cực các hoạt động trải nghiệm và vận dụng kiến thức tốt."], "H": ["Hiểu bài và biết vận dụng kiến thức vào cuộc sống hàng ngày.", "Hiểu bài và biết vận dụng kiến thức vào thực hành.", "Hiểu bài và làm bài tập đầy đủ.", "Nắm được kiến thức và biết vận dụng vào thực hành.", "Nắm được kiến thức và biết vận dụng vào cuộc sống hàng ngày.", "Nắm được kiến thức, kỹ năng cơ bản của môn học."], "C": ["Chưa tích cực tham gia các hoạt động; cần mạnh dạn hơn.", "Cần chủ động tham gia hoạt động tập thể hơn."]}, "Đạo đức": {"T": ["Tập trung trong giờ học, có kĩ năng xử lí tình huống tốt.", "Ứng xử nhanh, giải quyết tình huống trong bài học tốt.", "Vận dụng tốt các kiến thức đã học vào cuộc sống.", "Thực hiện tốt hành vi đạo đức đã học vào cuộc sống.", "Nắm được nội dung bài học và vận dụng tốt vào thực tiễn.", "Tự tin, chủ động trong các tình huống học tập.", "Tích cực phát biểu trong giờ học và ứng xử tốt.", "Học tập tốt, gương mẫu trong ứng xử và lời nói."], "H": ["Có nhận thức đúng đắn và hành vi đạo đức chuẩn mực.", "Biết điều chỉnh thái độ và hành vi đạo đức phù hợp.", "Hiểu bài và làm bài tập đầy đủ.", "Nhận biết được hành vi đúng sai.", "Nắm được kiến thức, kỹ năng cơ bản của môn học."], "C": ["Cần ghi nhớ và thực hiện các hành vi đã học.", "Cần được nhắc nhở thêm để thực hiện hành vi đúng."]}, "Tiếng Việt": {"10": ["Đọc lưu loát, diễn cảm, hiểu sâu nội dung bài; viết bài văn mạch lạc, giàu cảm xúc.", "Có năng khiếu môn Tiếng Việt, dùng từ hay, diễn đạt sáng tạo, chữ viết đẹp.", "Nắm vững kiến thức, đọc hiểu và viết rất tốt, trình bày bài đẹp.", "Đọc hay, viết đúng chính tả, bài văn có nhiều ý sáng tạo.", "Học tốt môn Tiếng Việt, kĩ năng đọc, viết, nói và nghe đều tốt."], "9": ["Đọc lưu loát, hiểu nội dung bài; viết đoạn văn mạch lạc, đúng chính tả.", "Nắm chắc kiến thức, dùng từ phong phú, trình bày bài sạch đẹp.", "Đọc to, rõ ràng, trả lời tốt câu hỏi; bài viết có ý hay.", "Viết văn đủ ý, câu văn rõ ràng, ít mắc lỗi.", "Đọc hiểu tốt, viết bài cẩn thận."], "8": ["Đọc đúng, hiểu nội dung chính; viết đoạn văn đủ ý, cần dùng từ sinh động hơn.", "Hoàn thành tốt bài học; cần chú ý thêm chính tả khi viết.", "Nắm được kiến thức; cần luyện đọc diễn cảm hơn."], "7": ["Đọc được bài, hiểu nội dung chính; cần luyện viết câu văn hay hơn.", "Hoàn thành bài học; còn mắc một số lỗi chính tả."], "6": ["Đọc còn chậm, hiểu một phần nội dung bài; cần đọc thêm mỗi ngày.", "Viết còn sai chính tả, câu văn chưa rõ ý; cần luyện viết thêm."], "5": ["Đọc chậm, chưa hiểu hết nội dung bài; cần cố gắng nhiều hơn.", "Viết đoạn văn còn ngắn, sai chính tả nhiều; cần luyện tập thêm."], "<5": ["Chưa nắm được kiến thức cơ bản của môn học; cần được hỗ trợ thêm.", "Đọc, viết chưa đạt yêu cầu; cần cô và gia đình kèm thêm."]}, "Tiếng Anh": {"10": ["Nghe, nói, đọc, viết tốt các nội dung đã học; phát âm chuẩn.", "Mạnh dạn giao tiếp, vận dụng tốt mẫu câu đã học.", "Học tốt môn Tiếng Anh, nhớ từ vựng nhanh."], "9": ["Nắm chắc từ vựng và mẫu câu, giao tiếp tốt.", "Phát âm rõ ràng, làm bài cẩn thận."], "8": ["Nắm được từ vựng, mẫu câu; cần luyện nói thêm.", "Hoàn thành tốt bài học; cần chú ý chính tả từ vựng."], "7": ["Hiểu bài cơ bản; cần luyện nghe, nói nhiều hơn."], "6": ["Nhớ từ vựng còn chậm; cần ôn luyện thêm."], "5": ["Cần ôn lại từ vựng và mẫu câu đã học."], "<5": ["Chưa nắm được kiến thức cơ bản; cần được hỗ trợ thêm."]}, "Giáo dục thể chất": {"T": ["Em thực hiện đúng, đẹp các động tác, tích cực tập luyện.", "Em nhanh nhẹn, tham gia trò chơi vận động sôi nổi.", "Em chăm tập thể dục, đứng hàng ngay ngắn."], "H": ["Em thực hiện được các động tác đã học; cần tập đều hơn.", "Em tham gia đầy đủ các hoạt động tập luyện."], "C": ["Em cần tập luyện thêm để thực hiện động tác đúng hơn.", "Em cần mạnh dạn tham gia trò chơi vận động hơn."]}, "Âm nhạc": {"T": ["Em hát đúng giai điệu, thuộc lời, biểu diễn tự tin.", "Em yêu thích âm nhạc, vận động theo nhạc nhịp nhàng.", "Em hát hay, mạnh dạn hát trước lớp."], "H": ["Em hát được các bài hát đã học; cần mạnh dạn biểu diễn hơn.", "Em tham gia đầy đủ các hoạt động âm nhạc."], "C": ["Em chưa thuộc lời một số bài hát; cần luyện tập thêm.", "Em cần tự tin hơn khi hát trước lớp."]}, "Mĩ thuật": {"T": ["Em vẽ đẹp, tô màu hài hòa, sản phẩm sáng tạo.", "Em khéo tay, có nhiều ý tưởng hay.", "Em hoàn thành sản phẩm đẹp, giữ đồ dùng gọn gàng."], "H": ["Em hoàn thành sản phẩm theo yêu cầu; cần tô màu cẩn thận hơn.", "Em biết thể hiện ý tưởng trong sản phẩm."], "C": ["Em cần hoàn thành sản phẩm đúng thời gian.", "Em cần được hướng dẫn thêm khi vẽ, tô màu."]}}, "Q": {"Tự chủ và tự học": {"T": ["Tích cực, tự giác hoàn thành nhiệm vụ học tập.", "Chủ động, tự giác thực hiện tốt các nhiệm vụ học tập.", "Luôn chủ động, cố gắng hoàn thành tốt các nhiệm vụ học tập.", "Tích cực, tự giác trong học tập và rèn luyện.", "Hăng hái tham gia các hoạt động học tập."], "D": ["Có khả năng tự học, tự chủ bản thân.", "Có khả năng tự hoàn thành các nhiệm vụ học tập."], "C": ["Cần tự giác hơn trong học tập."]}, "Giao tiếp và hợp tác": {"T": ["Trình bày rõ ràng, mạch lạc, hợp tác tốt với bạn.", "Mạnh dạn trong giao tiếp, biết lắng nghe và chia sẻ ý kiến.", "Kĩ năng giao tiếp tốt, diễn đạt rõ ràng, dễ hiểu.", "Có kĩ năng giao tiếp tốt, hợp tác nhóm có hiệu quả.", "Chấp hành tốt sự phân công trong sinh hoạt nhóm."], "D": ["Biết lắng nghe, có tinh thần hợp tác trong hoạt động nhóm.", "Biết phối hợp với bạn khi làm việc trong nhóm, lớp.", "Biết hợp tác với bạn khi tham gia các hoạt động nhóm."], "C": ["Cần mạnh dạn giao tiếp, hợp tác với bạn hơn."]}, "Giải quyết vấn đề và sáng tạo": {"T": ["Luôn chủ động nghĩ ra những cách khác nhau để giải quyết vấn đề.", "Vận dụng tốt điều đã học để giải quyết các vấn đề trong học tập và cuộc sống.", "Linh hoạt trong thực hiện và giải quyết các nhiệm vụ học tập.", "Giải quyết các vấn đề trong học tập, cuộc sống nhanh và hợp lí.", "Có nhiều sáng tạo, kĩ năng giải quyết vấn đề tốt."], "D": ["Phát hiện và nêu được các tình huống có vấn đề trong học tập.", "Có khả năng tự giải quyết các vấn đề trong học tập và cuộc sống.", "Biết tự giải quyết vấn đề đơn giản trong học tập và cuộc sống."], "C": ["Cần được hướng dẫn thêm khi gặp tình huống mới."]}, "Ngôn ngữ <script>
(function(){
"use strict";
/* ================= tiện ích ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>{d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};
const startOfWeek=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const fmtD=d=>{d=new Date(d);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const fmtDY=d=>{d=new Date(d);return fmtD(d)+"/"+d.getFullYear()};
const WD=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
const todayKey=()=>dkey(new Date());
const daysBetween=(a,b)=>Math.round((fromKey(dkey(b))-fromKey(dkey(a)))/864e5);
const sgn=n=>n>0?"+"+n:String(n);
const cls=n=>n>0?"pos":n<0?"neg":"zero";
const G=CONFIG.grade;

/* ================= dữ liệu ================= */
const STORE=CONFIG.storeKey;
function defaultTemplates(){return JSON.parse(JSON.stringify(CONFIG.templates))}
function freshState(){return {v:2,sample:false,className:"",teacher:"",school:"",students:[],items:JSON.parse(JSON.stringify(CONFIG.items)),
  ticks:{},extra:{},overrides:{},templates:defaultTemplates(),contacts:[],concerns:[],plans:[],drafts:[],lbg:null,dayPlans:{},assign:[],levels:{},support:[],planCfg:null,absences:[],healthNotes:{},duty:null,lvCmt:{},pq:{},scores:{},bank:{},cmtShift:{},
  settings:{key:"",model:""},metrics:{firstUse:Date.now(),manualTimes:[],aiCalls:0,exports:[],copies:0},createdAt:Date.now()}}
function sampleState(){
  const S=freshState();S.sample=true;S.className=CONFIG.sampleClass;
  S.students=CONFIG.sampleNames.map((n,i)=>({id:"s"+(i+1),name:n[0],group:String(n[1]),nick:n[0].split(" ").slice(-1)[0],phone:"",parent:""}));
  const items=S.items;const t={};const k=todayKey();
  const pick=(it,ids)=>{t[items[it].id]=ids.map(i=>"s"+i)};
  CONFIG.sampleTicks.forEach(([it,ids])=>pick(it,ids));
  S.ticks[k]=t;
  // vài ngày trước để có số liệu tuần
  const y=dkey(addDays(new Date(),-1));S.ticks[y]={};S.ticks[y][items[0].id]=["s2","s5","s9"];S.ticks[y][items[items.length-1].id]=["s3"];
  return S;
}
function migrate(o){const f=freshState();for(const k in f)if(o[k]===undefined)o[k]=f[k];
  o.templates=Object.assign(defaultTemplates(),o.templates||{});o.metrics=Object.assign(f.metrics,o.metrics||{});return o}
let S;
try{const r=localStorage.getItem(STORE);if(r)S=migrate(JSON.parse(r))}catch(e){}
if(!S)S=sampleState();
(function(){if((S.migr||0)<3){(CONFIG.items||[]).filter(it=>it.group==="trucnhat").forEach(it=>{if(!S.items.some(x=>x.id===it.id||x.label===it.label))S.items.push(JSON.parse(JSON.stringify(it)))});
  if(S.planCfg)CONFIG.trackSubs.forEach(x=>{if(!S.planCfg.trackSubs.includes(x))S.planCfg.trackSubs.push(x)});S.migr=3;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
  if((S.migr||0)<7){const cm={};(CONFIG.items||[]).forEach(it=>{cm[it.label]=it.cat});S.items.forEach(it=>{if(!it.cat&&cm[it.label])it.cat=cm[it.label]});S.migr=Math.max(S.migr||0,7);try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
  if((S.migr||0)<6){if(G===1&&S.items.every(i=>!Number(i.pts)))S.items.forEach(i=>{i.pts=i.kind==="khen"?1:-1});
    (CONFIG.items||[]).filter(it=>it.group==="tienbo").forEach(it=>{if(!S.items.some(x=>x.id===it.id||x.label===it.label))S.items.push(JSON.parse(JSON.stringify(it)))});S.migr=6;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
  if((S.migr||0)<5){if(S.planCfg)S.planCfg.trackSubs=CONFIG.trackSubs.slice();S.migr=5;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}})();
let saveWarned=false;
function save(){_crown=null;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast("Máy không cho lưu dữ liệu (đang ở chế độ ẩn danh?). Hãy mở bằng trình duyệt thường.")}}}

const stu=id=>S.students.find(s=>s.id===id);
const item=id=>S.items.find(i=>i.id===id);
const codeOf=s=>"HS"+pad(S.students.indexOf(s)+1);
const callName=s=>s.nick||s.name;
const groups=()=>[...new Set(S.students.map(s=>s.group))].sort((a,b)=>String(a).localeCompare(String(b),"vi",{numeric:true}));
function dayTicks(k){return S.ticks[k]||{}}
function itemsOf(k,sid){const t=dayTicks(k);return S.items.filter(it=>(t[it.id]||[]).includes(sid))}
function ptsOf(k,sid){return itemsOf(k,sid).reduce((a,it)=>a+(Number(it.pts)||0),0)}
function rangeKeys(a,b){const out=[];for(let d=fromKey(a);d<=fromKey(b);d=addDays(d,1))out.push(dkey(d));return out}

/* ================= GHÉP CÂU NHẬN XÉT (không dùng AI) ================= */
function cleanPhrase(p){p=String(p||"").trim().replace(/[.。!]+$/,"");return p?p.charAt(0).toLocaleLowerCase("vi")+p.slice(1):""}
function joinVi(arr){arr=arr.filter(Boolean);if(arr.length<=1)return arr.join("");return arr.slice(0,-1).join(", ")+" và "+arr[arr.length-1]}
function capFirst(s){s=String(s||"").trim();return s?s.charAt(0).toLocaleUpperCase("vi")+s.slice(1):""}
function endDot(s){s=String(s||"").trim();return !s?"":/[.!?…]$/.test(s)?s:s+"."}
function buildComment(k,sid){
  const T=S.templates;const ab=absentOn(k,sid);
  if(ab)return endDot(isSick(ab.reason)?(T.absentSick||"Hôm nay con nghỉ ốm. Cô chúc con mau khỏe và sớm trở lại lớp"):(T.absentOther||"Hôm nay con nghỉ học có phép"));const its=itemsOf(k,sid);
  const khen=its.filter(i=>i.kind==="khen").map(i=>cleanPhrase(i.phrase||i.label));
  const nhac=its.filter(i=>i.kind==="nhac").map(i=>cleanPhrase(i.phrase||i.label));
  const parts=[];const pre=String(T.prefix||"Hôm nay con").trim();
  if(khen.length)parts.push(endDot(pre+" "+joinVi(khen)));
  if(nhac.length)parts.push(endDot(pre+" "+joinVi(nhac)));
  if(!khen.length&&!nhac.length&&T.none)parts.push(endDot(T.none));
  const ex=((S.extra[k]||{})[sid]||"").trim();if(ex)parts.push(endDot(capFirst(ex)));
  let end="";
  if(khen.length&&!nhac.length)end=T.endKhen;else if(nhac.length&&!khen.length)end=T.endNhac;else if(khen.length&&nhac.length)end=T.endMix;else end=T.endNone;
  if(end)parts.push(endDot(end));
  return parts.join(" ");
}
function finalComment(k,sid){const o=(S.overrides[k]||{})[sid];return o!=null?o:buildComment(k,sid)}

/* ================= AI (Gemini) ================= */
const hasKey=()=>!!(S.settings.key||"").trim();
function nameRe(w){return new RegExp("(?<![\\p{L}\\p{M}])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\p{L}\\p{M}])","giu")}
function hide(text){
  const pairs=[];const cnt={};S.students.forEach(s=>{const n=(s.nick||"").toLowerCase();cnt[n]=(cnt[n]||0)+1});
  S.students.forEach(s=>{pairs.push([s.name,codeOf(s)]);if(s.nick&&cnt[s.nick.toLowerCase()]===1)pairs.push([s.nick,codeOf(s)]);if(s.parent)pairs.push([s.parent,"PH-"+codeOf(s)])});
  pairs.sort((a,b)=>b[0].length-a[0].length);let out=String(text||"").normalize("NFC");
  pairs.forEach(([n,c])=>{if(n&&n.trim().length>1)out=out.replace(nameRe(n.normalize("NFC")),c)});
  return out.replace(/(\+?84|0)\d{9,10}/g,"[SĐT]");
}
function unhide(text,fallbackSid){return String(text||"").replace(/PH-HS(\d{2})/g,(m,d)=>{const s=S.students[d-1];return s?("phụ huynh em "+callName(s)):m})
  .replace(/HS(\d{2})/g,(m,d)=>{const s=S.students[d-1];return s?callName(s):m}).replace(/\[TÊN\]/gi,()=>{const s=stu(fallbackSid);return s?callName(s):"em"})}
function extractJSON(t){t=String(t||"").replace(/```json|```/gi,"").trim();const a=t.search(/[\[{]/);if(a<0)throw new Error("Câu trả lời không đúng dạng.");
  const close=t[a]==="{"?"}":"]";return JSON.parse(t.slice(a,t.lastIndexOf(close)+1))}
async function gemini(prompt,json){
  const key=(S.settings.key||"").trim();
  const models=[...new Set([S.settings.model||"gemini-2.5-flash","gemini-flash-latest","gemini-2.0-flash"])];let last;
  for(const m of models){let res;
    try{res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:Object.assign({temperature:.5},json?{responseMimeType:"application/json"}:{})})})}
    catch(e){const er=new Error("Không kết nối được tới AI. Kiểm tra mạng, hoặc dùng cách sao chép sang Gemini.");er.offline=true;throw er}
    if(res.status===404){last=new Error("Không tìm thấy mô hình AI.");continue}
    if(!res.ok){let msg="";try{msg=(await res.json()).error.message}catch(e){}
      if(res.status===429)throw new Error("Hết lượt AI miễn phí trong lúc này. Chờ 1 phút rồi thử lại.");
      if(res.status===400||res.status===401||res.status===403)throw new Error("Mã AI chưa dùng được"+(msg?" (Google báo: "+msg+")":"")+". Kiểm tra lại mã trong mục Cài đặt, hoặc tạo mã mới ở aistudio.google.com.");
      throw new Error("AI báo lỗi "+res.status+". "+msg)}
    const d=await res.json();if(m!==S.settings.model)S.settings.model=m;S.metrics.aiCalls++;save();
    return ((((d.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("").trim();
  }
  throw last||new Error("Không gọi được AI.");
}
/* chạy AI: có mã thì gọi thẳng; không có mã thì hiện khung sao chép – dán */
async function runAI({prompt,json,onResult,statusEl,manualEl}){

function copy(text,msgEl,ok){const done=()=>{if(msgEl)msgEl.textContent=ok||"Đã sao chép."};

  function fb(){const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand("copy")}catch(e){}ta.remove();
    if(msgEl)msgEl.textContent=r?(ok||"Đã sao chép."):"Máy không cho sao chép tự động, hãy bôi đen để sao chép."}}

let dlCap;
async function download(name,blob){name=String(name).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^\w.\-]+/g,"-");
  if(window.claude&&window.claude.use){try{if(dlCap===undefined)dlCap=await window.claude.use("downloads");if(dlCap){await dlCap.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==="declined")return;toast("Không tải được file: "+(e&&e.message||"máy không cho phép"));return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportXLSX(name,rows,colWidths,sheet){

    const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});download(name+".xlsx",new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));return}
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");download(name+".csv",new Blob([csv],{type:"text/csv;charset=utf-8"}));
}

function parseLevel(v,pqMode){const t=String(v==null?"":v).normalize("NFC").trim().toLowerCase().replace(/\.$/,"");if(!t)return null;
  if(/^(t|htt|hoàn thành tốt|tốt|tot)$/.test(t))return "T";if(/^(c|cht|chưa hoàn thành|ccg|cần cố gắng|can co gang)$/.test(t))return "C";
  if(/^(h|ht|hoàn thành)$/.test(t))return pqMode?"D":"H";if(/^(đ|d|đạt|dat)$/.test(t))return pqMode?"D":"H";return null}
function importAssess(wb){const ws=wb.Sheets[wb.SheetNames[0]];const R=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});const low=v=>String(v==null?"":v).normalize("NFC").replace(/\s+/g," ").trim().toLowerCase();
  const h=R.findIndex(r=>r.some(c=>/^họ (và )?tên/.test(low(c))));if(h<0)throw new Error("Không thấy dòng có cột “Họ và tên”.");
  const head=R[h].map(low);const cN=head.findIndex(c=>/^họ (và )?tên/.test(c));const subs=planCfg().trackSubs;const map=[];
  head.forEach((c,j)=>{const sub=subs.find(x=>low(x)===c);if(sub){map.push({j,type:"M",key:sub});return}
    const m=c.match(/^(nl|pc)\s+(.+)$/);if(m){const it=PQGROUPS.flatMap(g=>g[2]).find(k=>low(k)===m[2]);if(it)map.push({j,type:"Q",key:it})}});
  if(!map.length)throw new Error("Không thấy cột môn học hoặc năng lực, phẩm chất nào khớp. Cô dùng file mẫu tải từ sổ nhé.");
  const lv=S.levels[trM]=S.levels[trM]||{};S.pq=S.pq||{};const pq=S.pq[trM]=S.pq[trM]||{};S.scores=S.scores||{};const sc=S.scores[trM]=S.scores[trM]||{};
  const byName={};S.students.forEach(s=>{byName[low(s.name)]=s});let nStu=0,nCell=0,miss=[];
  R.slice(h+1).forEach(row=>{const nm=low(row[cN]);if(!nm)return;const s=byName[nm];if(!s){miss.push(String(row[cN]).trim());return}nStu++;
    map.forEach(({j,type,key})=>{const v=row[j];if(v===""||v==null)return;
      if(type==="M"){const num=typeof v==="number"?v:(/^\d+([.,]\d+)?$/.test(String(v).trim())?Number(String(v).replace(",",".")):null);
        if(num!=null&&isScoreSub(key)){const n=Math.max(0,Math.min(10,Math.round(num)));(sc[s.id]=sc[s.id]||{})[key]=n;(lv[s.id]=lv[s.id]||{})[key]=lvFromScore(n);nCell++;return}
        const l=parseLevel(v,false);if(l){(lv[s.id]=lv[s.id]||{})[key]=l;if(sc[s.id])delete sc[s.id][key];nCell++}}
      else{const l=parseLevel(v,true);if(l){(pq[s.id]=pq[s.id]||{})[key]=l;nCell++}}})});
  save();return {nStu,nCell,miss}}

/* ================= LỊCH BÁO GIẢNG & KẾ HOẠCH HỌC TẬP ================= */
const SUBJ_NAME={"TIẾNG VIỆT":"Tiếng Việt","TOÁN":"Toán","TNXH":"Tự nhiên và Xã hội","ĐẠO ĐỨC":"Đạo đức","TIẾNG ANH":"Tiếng Anh","HĐTN":"Hoạt động trải nghiệm","GDTC":"Giáo dục thể chất","MĨ THUẬT":"Mĩ thuật","ÂM NHẠC":"Âm nhạc","TIN HỌC":"Tin học","KHOA HỌC":"Khoa học","LỊCH SỬ VÀ ĐỊA LÍ":"Lịch sử và Địa lí","LS-ĐL":"Lịch sử và Địa lí","LS&ĐL":"Lịch sử và Địa lí","CÔNG NGHỆ":"Công nghệ","TH CHD":"Tăng cường","ĐS THƯ VIỆN":"Đọc sách thư viện"};
const normS=x=>String(x==null?"":x).normalize("NFC").trim().toUpperCase().replace(/\s+/g," ");
const subjName=k=>SUBJ_NAME[normS(k)]||capFirst(String(k).trim().toLocaleLowerCase("vi"));
function planCfg(){if(!S.planCfg)S.planCfg={title:"Kế hoạch học tập",prepSubs:CONFIG.prepSubs.slice(),checkSubs:CONFIG.checkSubs.slice(),prepPrefix:Object.assign({},CONFIG.prepPrefix),chips:CONFIG.planChips.slice(),trackSubs:CONFIG.trackSubs.slice()};return S.planCfg}
function parseLBG(wb){
  const rows=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});
  const tkbName=wb.SheetNames.find(n=>/TH[ỜO]I\s*KH[ÓO]A\s*BI[ỂE]U|^TKB/i.test(n.normalize("NFC").trim()));
  if(!tkbName)throw new Error("Không thấy trang “THỜI KHÓA BIỂU” trong file.");
  const T=rows(tkbName);let h=-1,cD,cP,cM,cK;
  for(let r=0;r<Math.min(12,T.length);r++){const row=T[r].map(normS);const iD=row.indexOf("THỨ"),iP=row.indexOf("TIẾT"),iM=row.indexOf("MÔN"),iK=row.findIndex(x=>/^TIẾT THỨ/.test(x));
    if(iD>=0&&iP>=0&&iM>=0){h=r;cD=iD;cP=iP;cM=iM;cK=iK>=0?iK:iM+2;break}}
  if(h<0)throw new Error("Không đọc được bảng thời khóa biểu (cần các cột Thứ, Tiết, Môn).");
  const tkb=[];let day=0,sess="S",last=0;
  for(let r=h+1;r<T.length;r++){const row=T[r];const m=normS(row[cD]).match(/([2-7])/);if(m){day=+m[1];sess="S";last=0}
    const per=Number(row[cP]);if(!day||!per)continue;if(per<=last)sess="C";last=per;
    const sub=normS(row[cM]),k=Number(row[cK]);if(sub&&k)tkb.push({day,sess,per,sub,k})}
  if(!tkb.length)throw new Error("Thời khóa biểu trong file đang trống.");
  const subs=new Set(tkb.map(x=>x.sub));let best=null;
  wb.SheetNames.filter(n=>/^PPCT/i.test(n.trim())).forEach(n=>{let hit=0;const map={};
    rows(n).forEach(row=>{const sub=normS(row[2]),w=Number(row[3]),k=Number(row[4]),name=String(row[6]==null?"":row[6]).replace(/\s+/g," ").trim();
      if(sub&&w&&k&&name){map[w+"|"+sub+"|"+k]=name;if(subs.has(sub))hit++}});
    if(!best||hit>best.hit)best={n,hit,map}});
  if(!best||!best.hit)throw new Error("Không thấy trang PPCT khớp với thời khóa biểu.");
  return {tkb,ppct:best.map,sheet:best.n.trim()};
}
function weekOf(k){if(!S.lbg)return null;return Math.floor(daysBetween(S.lbg.week1,fromKey(k))/7)+1}
function lessonsOn(k){if(!S.lbg)return [];const d=fromKey(k),dow=d.getDay();if(dow===0||dow===6)return [];const w=weekOf(k);
  return S.lbg.tkb.filter(x=>x.day===dow+1).map(x=>Object.assign({},x,{name:S.lbg.ppct[w+"|"+x.sub+"|"+x.k]||""}))}
function nextSchoolDay(k){let d=addDays(fromKey(k),1);while(d.getDay()===0||d.getDay()===6)d=addDays(d,1);return dkey(d)}
const stripTiet=n=>String(n).replace(/\s*\((tiết|tiet|t)\s*\d+\)\s*$/i,"").replace(/\s*\(tt\)\s*$/i,"").trim();
const shortBai=n=>{const m=stripTiet(n).match(/^(Bài\s*\d+)/i);return m?m[1]:stripTiet(n)};
function groupLessons(list,subs){const out=[];const set=new Set(subs.map(normS));
  list.filter(x=>set.has(x.sub)&&x.name).forEach(x=>{let g=out.find(o=>o.sub===x.sub);if(!g){g={sub:x.sub,names:[]};out.push(g)}const n=stripTiet(x.name);if(!g.names.includes(n))g.names.push(n)});
  return out.sort((a,b)=>subs.map(normS).indexOf(a.sub)-subs.map(normS).indexOf(b.sub))}
/* bài tập & hạn nộp */
function occurrences(a,from,to){const out=[];let d=fromKey(a.due);let guard=0;
  while(dkey(d)<=to&&guard++<400){const k=dkey(d);if(k>=from)out.push(k);if(a.repeat==="week")d=addDays(d,7);else if(a.repeat==="month"){d=new Date(d.getFullYear(),d.getMonth()+1,fromKey(a.due).getDate())}else break}
  return out}
function dueItems(from,to,inclDone){const res=[];S.assign.forEach(a=>occurrences(a,from,to).forEach(k=>{const done=(a.done||[]).includes(k);if(inclDone||!done)res.push({a,k,done})}));return res.sort((x,y)=>x.k.localeCompare(y.k))}
function tipFor(sub,k){const lib=CONFIG.tips[normS(sub)]||CONFIG.tips["*"];const i=Math.abs(fromKey(k).getDate()+fromKey(k).getMonth())%lib.length;return lib[i]}
function genPlan(k){
  const C=planCfg();const nk=nextSchoolDay(k);
  const prep=groupLessons(lessonsOn(nk),C.prepSubs).map(g=>`${subjName(g.sub)}: ${C.prepPrefix[g.sub]||""}${g.names.join("; ")}`);
  const chk=groupLessons(lessonsOn(k),C.checkSubs).map(g=>`VBT ${subjName(g.sub)} (${[...new Set(g.names.map(shortBai))].join(", ")})`);
  dueItems(dkey(addDays(fromKey(k),1)),nk).forEach(x=>chk.push(`Nộp ${x.a.title}${x.a.sub?" ("+x.a.sub+")":""} – hạn ${WD[fromKey(x.k).getDay()].toLowerCase()} ${fmtD(fromKey(x.k))}`));
  const main=groupLessons(lessonsOn(nk),C.prepSubs)[0];
  return {prep:prep.join("\n"),check:chk.join("\n"),tip:tipFor(main?main.sub:"*",k),auto:true};
}

function drawPlan(){
  const cv=$("#plCanvas");if(!cv)return;const g=cv.getContext("2d");const W=1600,H=900;const pl=S.dayPlans[planK]||{};const C=planCfg();const th=CONFIG.theme;

  const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,CONFIG.imgBg[0]);bg.addColorStop(1,CONFIG.imgBg[1]);g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.globalAlpha=.18;g.fillStyle=th;[[120,820,160],[1500,120,140],[1460,800,90],[90,120,70]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()});g.globalAlpha=1;
  const px=70,py=150,pw=W-140,ph=H-190;g.fillStyle="rgba(255,255,255,.93)";rr(g,px,py,pw,ph,28);g.fill();
  g.textAlign="center";g.textBaseline="alphabetic";g.fillStyle=th;g.font="800 72px 'Baloo 2', 'Be Vietnam Pro', sans-serif";
  g.fillText((C.title||"Kế hoạch học tập")+(S.className?" - "+S.className:""),W/2,100,W-120);
  const hd=planHeader();g.font="700 38px 'Be Vietnam Pro', sans-serif";const hw=Math.min(g.measureText(hd).width+60,W-200);
  g.fillStyle="#ffe45c";rr(g,(W-hw)/2,122,hw,62,18);g.fill();g.fillStyle="#d93a1f";g.fillText(hd,W/2,166,hw-40);
  const blocks=[];if(L(pl.prep).length)blocks.push(["1. Chuẩn bị bài mới",L(pl.prep),"•"]);if(L(pl.check).length)blocks.push(["2. Nhắc nhở – Ba mẹ kiểm tra",L(pl.check),"+"]);if(String(pl.tip||"").trim())blocks.push(["3. Ba mẹ đồng hành cùng con",[pl.tip.trim()],""]);
  if(!blocks.length){g.fillStyle="#8a94a6";g.font="500 34px 'Be Vietnam Pro', sans-serif";g.fillText("Nhập nội dung kế hoạch ở trên",W/2,520);return}
  g.textAlign="left";const left=px+60,maxW=pw-120;let scale=1;
  const wrap=(t,f)=>{g.font=f;const words=t.split(/\s+/);const lines=[];let cur="";words.forEach(w=>{const tt=cur?cur+" "+w:w;if(g.measureText(tt).width>maxW-40&&cur){lines.push(cur);cur=w}else cur=tt});if(cur)lines.push(cur);return lines};
  for(let it=0;it<8;it++){let y=py+70;const hs=Math.round(38*scale),bs=Math.round(32*scale);
    blocks.forEach(([h,items])=>{y+=hs*1.35;items.forEach(t=>{y+=wrap(t,`500 ${bs}px 'Be Vietnam Pro', sans-serif`).length*bs*1.35});y+=bs*.5});
    if(y<=py+ph-20)break;scale*=.9}
  let y=py+70;const hs=Math.round(38*scale),bs=Math.round(32*scale);
  blocks.forEach(([h,items,mk])=>{g.fillStyle="#e0472b";g.font=`700 ${hs}px 'Be Vietnam Pro', sans-serif`;g.fillText(h,left,y);y+=hs*1.35;
    items.forEach(t=>{const ls=wrap(t,`500 ${bs}px 'Be Vietnam Pro', sans-serif`);g.fillStyle="#1d2a55";ls.forEach((l,i)=>{if(i===0&&mk)g.fillText(mk,left+14,y);g.fillText(l,left+(mk?48:14),y);y+=bs*1.35})});y+=bs*.5});
}

     ${(p.log||[]).map(l=>`<p class="small"><span class="muted">${fmtD(l.ts)}:</span> <span class="tag ${l.lv==="Chưa tiến bộ"?"nhac":"khen"}">${esc(l.lv)}</span> ${esc(l.text)}</p>`).join("")}
     <div class="row"><select id="spl-${p.id}" style="width:auto"><option>Tiến bộ rõ</option><option>Có tiến bộ</option><option>Chưa tiến bộ</option></select><input type="text" id="spt-${p.id}" placeholder="Ghi chú tuần này…" style="flex:1 1 180px"><button class="btn sm" data-spl="${p.id}">Ghi</button>
      <button class="btn sm" data-spd="${p.id}">${p.status==="done"?"Hỗ trợ tiếp":"Đã đạt mục tiêu"}</button><button class="btn sm ghost danger" data-spx="${p.id}">Xóa</button></div></div>`}).join(""):'<p class="muted small">Chưa có em nào.</p>'}</div>`;
  const note=()=>{const t=$("#suT").value;$("#suNote").innerHTML=t==="sign"?`<div class="hint warn small">Cô không tự kết luận em bị khuyết tật hay mắc bệnh. Hãy ghi lại quan sát khách quan, trao đổi với Ban giám hiệu, và cùng gia đình đề nghị đánh giá tại cơ sở chuyên môn (ví dụ trung tâm hỗ trợ phát triển giáo dục hòa nhập hoặc bệnh viện nhi). Trong lúc chờ, kế hoạch hỗ trợ giúp em không bị tụt lại.</div>`:t==="inc"?`<div class="hint small">Với học sinh khuyết tật học hòa nhập, nhà trường cần có kế hoạch giáo dục cá nhân theo quy định về giáo dục hòa nhập. Bản nháp ở đây giúp cô chuẩn bị nội dung, cần thống nhất với nhà trường và gia đình.</div>`:""};
  $("#suT").onchange=note;note();
  const collect=()=>({id:uid(),sid:$("#suS").value,type:$("#suT").value,subs:[...el.querySelectorAll("[data-sus]:checked")].map(c=>c.dataset.sus),diffs:[...el.querySelectorAll("[data-sud]:checked")].map(c=>CONFIG.difficulties[c.dataset.sud]),obs:$("#suO").value.trim(),good:$("#suG").value.trim(),plan:null,log:[],status:"open",createdAt:Date.now()});
  $("#suSave").onclick=()=>{S.support.push(collect());save();supPre=null;rSupport()};
  $("#suGo").onclick=()=>{const p=collect();if(!p.subs.length&&!p.diffs.length&&!p.obs){$("#suSt").textContent="Cô chọn môn, khó khăn hoặc ghi quan sát trước.";return}
    S.support.push(p);save();const s=stu(p.sid);const m=todayKey().slice(0,7);const lv=(S.levels[m]||{})[s.id]||{};
    const prompt=`Bạn là chuyên gia giáo dục tiểu học và giáo dục hòa nhập ở Việt Nam, hỗ trợ giáo viên chủ nhiệm lớp ${G} (học sinh ${G==1?"6–7":"9–10"} tuổi).
Học sinh ${codeOf(s)}. Đối tượng: ${SUPT[p.type]}.
Môn cần hỗ trợ: ${p.subs.join(", ")||"(chưa chọn)"}. Khó khăn giáo viên quan sát: ${p.diffs.join("; ")||"(không chọn)"}. Ghi thêm: ${hide(p.obs)||"(không có)"}. Điểm mạnh, sở thích: ${hide(p.good)||"(không có)"}.
Kết quả tháng này: ${Object.keys(lv).length?Object.entries(lv).map(([k,v])=>k+": "+LV[v]).join("; "):"chưa có"}. ${summaryFor(s,rangeKeys(dkey(addDays(new Date(),-30)),todayKey()))}.
Hãy soạn KẾ HOẠCH HỖ TRỢ CÁ NHÂN 4 TUẦN, ngắn gọn, thực tế, gồm:
1. Mục tiêu 4 tuần: 2–3 mục tiêu nhỏ, cụ thể, đo được (ví dụ "đọc đúng 5 vần mới").
2. Hoạt động trên lớp theo từng tuần (tuần 1 đến tuần 4), mỗi tuần 2–3 việc, có cách giao nhiệm vụ vừa sức, bạn học cùng tiến, khen ngợi kịp thời.
3. Ba mẹ đồng hành ở nhà: 3–4 việc, mỗi việc 10–15 phút, làm được ngay.
4. Cách theo dõi tiến bộ hằng tuần: dấu hiệu cụ thể cho thấy em đạt mục tiêu.
5. Gợi ý trao đổi với phụ huynh: một đoạn lời mở đầu mẫu tế nhị, bắt đầu từ điểm mạnh của con, nhấn mạnh cô và gia đình cùng giúp con.
6. Khi nào cần đề xuất nhà trường phối hợp đánh giá chuyên môn.
Quy tắc: không chẩn đoán, không gán nhãn bệnh hay khuyết tật; dùng lời tôn trọng; gọi học sinh là "em" hoặc "con"; không viết mã HSxx; không dùng ký hiệu markdown như ** hay #.`;
    runAI({prompt,json:false,statusEl:$("#suSt"),manualEl:$("#suMan"),onResult:t=>{p.plan=unhide(t,p.sid).replace(/\*\*|^#+\s*/gm,"");p.approvedAt=null;save();supPre=null;rSupport()}})};
  el.querySelectorAll("[data-spnx]").forEach(b=>b.onclick=()=>{trView="nx";show("track")});
  el.querySelectorAll("textarea[id^=sp-]").forEach(t=>t.oninput=()=>{const p=S.support.find(x=>"sp-"+x.id===t.id);p.plan=t.value;p.edited=true;save()});
  el.querySelectorAll("[data-spa]").forEach(b=>b.onclick=()=>{const p=S.support.find(x=>x.id===b.dataset.spa);p.approvedAt=Date.now();save();rSupport()});
  el.querySelectorAll("[data-spc]").forEach(b=>b.onclick=()=>{const p=S.support.find(x=>x.id===b.dataset.spc);const s=stu(p.sid);copy("KẾ HOẠCH HỖ TRỢ CÁ NHÂN – "+(s?s.name:"")+"\n\n"+p.plan,el.querySelector(`[data-spm="${p.id}"]`))});
  el.querySelectorAll("[data-spl]").forEach(b=>b.onclick=()=>{const p=S.support.find(x=>x.id===b.dataset.spl);(p.log=p.log||[]).push({ts:Date.now(),lv:$("#spl-"+p.id).value,text:$("#spt-"+p.id).value.trim()});save();rSupport()});
  el.querySelectorAll("[data-spd]").forEach(b=>b.onclick=()=>{const p=S.support.find(x=>x.id===b.dataset.spd);p.status=p.status==="done"?"open":"done";save();rSupport()});
  el.querySelectorAll("[data-spx]").forEach(b=>b.onclick=()=>{const i=S.support.findIndex(x=>x.id===b.dataset.spx);const p=S.support.splice(i,1)[0];save();rSupport();toast("Đã xóa",()=>{S.support.splice(i,0,p);save();rSupport()})});
}

/* ================= SỨC KHỎE ================= */
const REASONS=["Ốm, sốt","Ho, cảm cúm","Đau bụng, tiêu chảy","Đau răng, đau mắt","Tai nạn nhỏ, chấn thương","Việc gia đình","Khác"];
const isSick=r=>!/Việc gia đình/.test(r||"");
function absentOn(k,sid){return (S.absences||[]).find(a=>a.sid===sid&&a.from<=k&&k<=(a.to||a.from))}
function schoolDays(a,b){return rangeKeys(a,b).filter(k=>{const d=fromKey(k).getDay();return d>0&&d<6}).length}
function healthTasks(){const out=[];const t=todayKey();
  (S.absences||[]).forEach(a=>{const s=stu(a.sid);if(!s)return;const to=a.to||a.from;const n=schoolDays(a.from,to)||1;const done=a.done||{};
    if(isSick(a.reason))out.push({a,key:"ask",due:a.from,text:`Nhắn hỏi thăm phụ huynh em ${callName(s)} (${a.reason.toLowerCase()})`,done:!!done.ask});
    if(n>=3)out.push({a,key:"call",due:dkey(addDays(fromKey(a.from),2)),text:`Gọi điện hỏi thăm em ${callName(s)} (nghỉ ${n} ngày)`,done:!!done.call,n});
    out.push({a,key:"back",due:nextSchoolDay(to),text:`Hỏi thăm ${callName(s)} khi đi học lại, hướng dẫn con bù bài; nhắn phụ huynh yên tâm`,done:!!done.back,n});
  });
  return out.filter(x=>!x.done&&x.due<=dkey(addDays(new Date(t),1))).sort((x,y)=>x.due.localeCompare(y.due))}
const CARE={
 "Ốm, sốt":"cô nghe tin {con} bị sốt nên hôm nay phải nghỉ học, cô thương con lắm ạ. Không biết con đã đỡ sốt chưa ạ? Gia đình cho con uống nhiều nước, ăn cháo hoặc đồ mềm dễ tiêu và nghỉ ngơi nhiều nhé; nếu con sốt cao kéo dài hoặc mệt hơn thì mình đưa con đi khám sớm ạ.",
 "Ho, cảm cúm":"cô nghe tin {con} bị ho, cảm nên nghỉ học, cô rất lo cho con ạ. Gia đình nhớ giữ ấm cổ cho con, cho con uống nước ấm và nghỉ ngơi đầy đủ; nếu con ho nhiều, khó thở hoặc sốt thì mình đưa con đi khám nhé.",
 "Đau bụng, tiêu chảy":"cô nghe tin {con} bị đau bụng nên nghỉ học, cô thương con quá ạ. Gia đình cho con ăn đồ nhẹ, dễ tiêu, uống đủ nước và theo dõi thêm; nếu con đau nhiều, mệt lả hoặc đi ngoài nhiều lần thì mình đưa con đi khám ngay nhé.",
 "Đau răng, đau mắt":"cô nghe tin {con} bị đau nên nghỉ học, mong con sớm hết đau ạ. Gia đình cho con nghỉ ngơi và khám theo hướng dẫn của bác sĩ nhé.",
 "Tai nạn nhỏ, chấn thương":"cô nghe tin {con} bị đau do va chạm nên nghỉ học, cô rất lo ạ. Con đã đỡ đau chưa ạ? Gia đình theo dõi vết thương cho con, nếu sưng đau nhiều thì đưa con đi khám nhé. Khi con đi học lại, cô sẽ để ý nhắc con cẩn thận hơn.",
 "Khác":"cô nhận được tin {con} nghỉ học hôm nay. Con có ổn không ạ? Nếu con không khỏe, gia đình cho con nghỉ ngơi đầy đủ nhé."};
function careVars(a){const s=stu(a.sid)||{};const nm=callName(s)||"con";return {nm,con:(G===1?"bé ":"")+nm,ph:s.parent?("anh/chị "+s.parent):"anh/chị"}}
function askMsg(a){const v=careVars(a);const body=(CARE[a.reason]||CARE["Khác"]).replace(/\{con\}/g,v.con);
  if(!isSick(a.reason))return `Dạ chào ${v.ph}, cô đã nhận được tin ${v.con} nghỉ học vì việc gia đình ạ. Bài học trên lớp cô sẽ gửi lại và kèm con học bù để con theo kịp các bạn, ${v.ph} yên tâm nhé. Cảm ơn gia đình đã báo cho cô ạ!`;
  return `Dạ chào ${v.ph}, ${body} Bài vở trên lớp ${v.ph} đừng lo, khi con đi học lại cô sẽ kèm con học bù. Cô và các bạn mong ${v.nm} mau khỏe để đến lớp ạ! ❤️`}
function callMsg(a,n){const v=careVars(a);return `Gợi ý khi gọi điện: chào hỏi ${v.ph}; hỏi tình hình sức khỏe của ${v.nm} sau ${n} ngày nghỉ (đã đi khám chưa, bác sĩ dặn gì, con ăn uống, ngủ thế nào); cho biết bài vở đã học trong những ngày qua và cách cô sẽ giúp con học bù; hỏi gia đình có cần cô hỗ trợ gì không; chúc con mau khỏe.`}
function backMsg(a){const v=careVars(a);return `Dạ chào ${v.ph}, hôm nay ${v.con} đã đi học lại rồi ạ. Cô thấy con đã khỏe hơn, cô đã hướng dẫn con học bù phần bài những hôm nghỉ. Ở nhà ${v.ph} nhắc con ăn uống, ngủ nghỉ điều độ để giữ sức khỏe nhé. Cô cảm ơn gia đình ạ!`}
let hlM=todayKey().slice(0,7);

  const mAbs=S.students.map(s=>({s,n:(S.absences||[]).filter(a=>a.sid===s.id).reduce((t,a)=>t+rangeKeys(a.from,a.to||a.from).filter(k=>k.startsWith(hlM)&&fromKey(k).getDay()%6!==0).length,0)})).filter(x=>x.n);
  P("health").innerHTML=`
  <div class="card"><h2>${H("health","Sức khỏe và chuyên cần")}</h2><p class="small muted">Ghi lại em nghỉ học; sổ nhắc cô hỏi thăm đúng lúc và có sẵn tin nhắn mẫu. Ngày em nghỉ, lời nhận xét hằng ngày tự đổi thành câu hỏi thăm.</p>

    <label class="f">Nghỉ từ ngày<input type="date" id="hlA" value="${todayKey()}"></label><label class="f">Đến ngày<input type="date" id="hlB" value="${todayKey()}"></label>

     <textarea id="hm-${id}" rows="4">${esc(msg)}</textarea><div class="row">${x.key!=="call"?`<button class="btn sm" data-hcp="${id}">Sao chép tin nhắn</button>`:""}<button class="btn sm primary" data-hd="${x.a.id}|${x.key}">Đã hỏi thăm</button><span class="small muted" data-hcm="${id}"></span></div></div>`}).join(""):'<p class="small muted">Không có việc hỏi thăm nào.</p>'}<span class="small muted" id="hlM"></span></div>
  <div class="card"><div class="row"><h3 class="grow">Số buổi nghỉ trong tháng</h3><input type="month" id="hlMo" value="${hlM}" style="width:auto"><button class="btn sm" id="hlX">Xuất Excel</button></div>
   ${mAbs.length?`<div class="list">${mAbs.sort((a,b)=>b.n-a.n).map(x=>`<div class="li"><b class="grow">${esc(x.s.name)}</b><span>${x.n} buổi</span></div>`).join("")}</div>`:'<p class="small muted">Tháng này chưa có em nào nghỉ.</p>'}</div>
  <div class="card"><h3>Nhật ký nghỉ học</h3>${list.length?`<div class="list">${list.slice(0,60).map(a=>{const s=stu(a.sid);return `<div class="li"><span class="small muted" style="min-width:6.5em">${fmtD(fromKey(a.from))}${a.to&&a.to!==a.from?"–"+fmtD(fromKey(a.to)):""}</span><span class="grow"><b>${esc(s?s.name:"")}</b> · ${esc(a.reason)}${a.paid?"":" · không phép"}${a.note?` <span class="muted">· ${esc(a.note)}</span>`:""}</span><button class="btn sm ghost danger" data-hx="${a.id}" aria-label="Xóa">✕</button></div>`}).join("")}</div>`:'<p class="small muted">Chưa có.</p>'}</div>
  <div class="card"><h3>Lưu ý sức khỏe từng em</h3><p class="small muted">Ví dụ: dị ứng tôm, hen suyễn, cận thị cần ngồi bàn đầu. Chỉ lưu trên máy này và không gửi cho AI.</p>
   <div class="scroll-x"><table class="t"><tbody>${S.students.map(s=>`<tr><td style="width:30%"><b>${esc(s.name)}</b></td><td><input type="text" id="hn-${s.id}" data-hn="${s.id}" value="${esc((S.healthNotes||{})[s.id]||"")}" placeholder="—"></td></tr>`).join("")}</tbody></table></div></div>`;
  $("#hlA").onchange=()=>{if($("#hlB").value<$("#hlA").value)$("#hlB").value=$("#hlA").value};
  $("#hlAdd").onclick=()=>{const a={id:uid(),sid:$("#hlS").value,from:$("#hlA").value||todayKey(),to:$("#hlB").value||$("#hlA").value,reason:$("#hlR").value,paid:$("#hlP").checked,note:$("#hlN").value.trim(),done:{},createdAt:Date.now()};if(a.to<a.from)a.to=a.from;(S.absences=S.absences||[]).push(a);save();rHealth();toast("Đã ghi em nghỉ học.")};

let dbP=null;
function idb(){if(dbP)return dbP;dbP=new Promise((res,rej)=>{let r;try{r=indexedDB.open(STORE+"-album",1)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{r.result.createObjectStore("photos",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbP}
async function photoAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("photos").objectStore("photos").getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>a.date.localeCompare(b.date)||a.added-b.added));q.onerror=()=>rej(q.error)})}
async function photoPut(p){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("photos","readwrite");t.objectStore("photos").put(p);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function photoDel(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("photos","readwrite");t.objectStore("photos").delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function shrink(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,w:c.width,h:c.height}):rej(new Error("Không đọc được ảnh")),"image/jpeg",.85)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Không đọc được ảnh "+file.name))};im.src=url})}

   ${!shown.length&&!err?'<p class="muted small">Chưa có ảnh nào. Bấm “Thêm ảnh” để chọn ảnh từ máy.</p>':""}</div>
  <div class="card"><h3>Tạo video tổng kết</h3>
   <div class="row end"><label class="f grow">Tiêu đề video<input type="text" id="vdT" value="${esc((S.className||"Lớp "+G)+" – Năm học 2026–2027")}"></label>
    <label class="f">Ảnh từ<select id="vdR"><option value="all">Tất cả ảnh</option><option value="hk1">Học kì I (9/2026 – 1/2027)</option><option value="hk2">Học kì II (1 – 5/2027)</option>${months.map(m=>`<option value="${m}">Tháng ${m.slice(5)}/${m.slice(0,4)}</option>`).join("")}</select></label>
    <label class="f">Mỗi ảnh (giây)<input type="number" id="vdS" min="2" max="8" value="3"></label></div>
   <div class="row end"><label class="f grow">Lời kết (hiện ở cuối video)<input type="text" id="vdE" value="Cảm ơn các con và Quý phụ huynh đã đồng hành cùng lớp!"></label><button class="btn sm" id="vdAI">AI viết lời kết</button></div>
   <div class="row"><label class="btn" for="vdMu" style="cursor:pointer">Chọn nhạc nền (không bắt buộc)</label><input type="file" id="vdMu" accept="audio/*" hidden><span class="small muted" id="vdMuN">Chưa chọn nhạc. Cô nên chọn bản nhạc không lời hoặc bài hát thiếu nhi được phép dùng.</span></div>

  el.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{alF=b.dataset.af;rAlbum()});
  $("#alIn").onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;let n=0;for(const f of fs){$("#alM").innerHTML=`<span class="spin"></span> Đang thêm ảnh ${n+1}/${fs.length}…`;
      try{const r=await shrink(f,1600);await photoPut({id:uid(),date:dkey(f.lastModified||Date.now()),caption:"",blob:r.blob,w:r.w,h:r.h,added:Date.now()+n});n++}catch(er){$("#alM").textContent=er.message}}
    S.metrics.photos=(S.metrics.photos||0)+n;save();rAlbum().then(()=>{$("#alM").textContent="Đã thêm "+n+" ảnh. Cô ghi chú thích cho từng ảnh để video có lời."})};
  const upd=async(id,f)=>{const all=await photoAll();const p=all.find(x=>x.id===id);if(p){f(p);await photoPut(p)}};
  el.querySelectorAll("[data-pc]").forEach(i=>i.onchange=()=>upd(i.dataset.pc,p=>p.caption=i.value.trim()));
  el.querySelectorAll("[data-pd]").forEach(i=>i.onchange=()=>{if(i.value)upd(i.dataset.pd,p=>p.date=i.value).then(rAlbum)});
  el.querySelectorAll("[data-px]").forEach(b=>b.onclick=async()=>{await photoDel(b.dataset.px);rAlbum()});
  let music=null;$("#vdMu").onchange=e=>{music=e.target.files[0]||null;$("#vdMuN").textContent=music?"Nhạc: "+music.name:"Chưa chọn nhạc."};
  $("#vdAI").onclick=()=>{const st=yearStats();const prompt=`Viết MỘT câu lời kết (dưới 25 chữ) cho video tổng kết năm học của ${S.className||"lớp "+G}, ấm áp, gửi các con và phụ huynh. Số liệu: ${st.map(x=>x[0]+": "+x[1]).join("; ")}. Chỉ trả về câu đó, không ngoặc kép.`;
    runAI({prompt,json:false,statusEl:$("#vdM"),manualEl:$("#vdMan"),onResult:t=>{$("#vdE").value=t.replace(/^["“]|["”]$/g,"").trim()}})};
  $("#vdGo").onclick=async()=>{const r=$("#vdR").value;const all=await photoAll();const sel=all.filter(p=>r==="all"||(r==="hk1"?p.date<"2027-01-17":r==="hk2"?p.date>="2027-01-17":p.date.startsWith(r)));
    if(!sel.length){$("#vdM").textContent="Chưa có ảnh trong khoảng đã chọn.";return}
    $("#vdGo").disabled=true;try{await makeVideo(sel,{title:$("#vdT").value,sec:Math.max(2,Math.min(8,+$("#vdS").value||3)),end:$("#vdE").value,stats:$("#vdSt").checked,music})}catch(e){$("#vdM").textContent="Không tạo được video: "+e.message}finally{$("#vdGo").disabled=false}};

function yearStats(){let khen=0;Object.keys(S.ticks).forEach(k=>S.items.forEach(it=>{if(it.kind==="khen")khen+=((S.ticks[k][it.id])||[]).length}));
  const days=Object.keys(S.ticks).filter(k=>Object.values(S.ticks[k]).some(a=>a.length)).length;
  const duty=Object.keys(S.ticks).reduce((a,k)=>a+S.items.filter(i=>i.group==="trucnhat"&&i.kind==="khen").reduce((b,i)=>b+((S.ticks[k][i.id])||[]).length,0),0);
  return [["Ngày cô ghi nhận xét",days],["Lời khen các con nhận được",khen],["Lượt trực nhật được khen",duty],["Học sinh của lớp",S.students.length]]}
async function makeVideo(photos,o){
  const W=1280,H=720,FPS=30;const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  if(!cv.captureStream||!window.MediaRecorder)throw new Error("trình duyệt này chưa hỗ trợ. Hãy dùng Chrome hoặc Edge trên máy tính.");
  const imgs=[];for(const p of photos){const u=URL.createObjectURL(p.blob);const im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=u});imgs.push({im,p,u})}
  // kịch bản các cảnh
  const scenes=[{type:"title",dur:3.5}];let lastM="";
  imgs.forEach(x=>{const m=x.p.date.slice(0,7);if(m!==lastM){scenes.push({type:"month",m,dur:2});lastM=m}scenes.push({type:"photo",x,dur:o.sec})});
  if(o.stats)scenes.push({type:"stats",dur:5});scenes.push({type:"end",dur:4});
  const total=scenes.reduce((a,s)=>a+s.dur,0);let t0=0;scenes.forEach(s=>{s.t0=t0;t0+=s.dur});
  const stream=cv.captureStream(FPS);let actx=null,src=null;
  if(o.music){actx=new AudioContext();const buf=await actx.decodeAudioData(await o.music.arrayBuffer());src=actx.createBufferSource();src.buffer=buf;src.loop=true;const gain=actx.createGain();gain.gain.value=.8;const dst=actx.createMediaStreamDestination();src.connect(gain);gain.connect(dst);dst.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr))}
  const types=["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm"];const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||"";
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5e6}:{});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const th=CONFIG.theme;const font=(w,s)=>`${w} ${s}px 'Be Vietnam Pro', sans-serif`;
  const center=(txt,y,f,col)=>{g.font=f;g.fillStyle=col;g.textAlign="center";g.fillText(txt,W/2,y,W-120)};
  const bg=()=>{const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,CONFIG.imgBg[0]);gr.addColorStop(1,CONFIG.imgBg[1]);g.fillStyle=gr;g.fillRect(0,0,W,H)};
  const draw=(t)=>{const s=scenes.find(x=>t>=x.t0&&t<x.t0+x.dur)||scenes[scenes.length-1];const lt=t-s.t0;const fade=Math.min(1,lt/.5,(s.dur-lt)/.5);
    g.globalAlpha=1;g.fillStyle="#000";g.fillRect(0,0,W,H);g.globalAlpha=Math.max(0,fade);
    if(s.type==="photo"){const {im,p}=s.x;const z=1+.08*(lt/s.dur);const sc=Math.max(W/im.width,H/im.height)*z;const w=im.width*sc,h=im.height*sc;
      g.filter="blur(18px) brightness(.6)";g.drawImage(im,(W-w)/2,(H-h)/2,w,h);g.filter="none";
      const sc2=Math.min(W/im.width,H/im.height)*z*.96;const w2=im.width*sc2,h2=im.height*sc2;g.drawImage(im,(W-w2)/2,(H-h2)/2,w2,h2);
      if(p.caption){g.fillStyle="rgba(0,0,0,.5)";g.fillRect(0,H-96,W,96);center(p.caption,H-38,font(700,40),"#fff")}
      g.font=font(600,22);g.fillStyle="rgba(255,255,255,.85)";g.textAlign="right";g.fillText(fmtDY(fromKey(p.date)),W-28,40)}
    else{bg();if(s.type==="title"){center(o.title,H/2-10,font(800,64),th);center("Những khoảnh khắc đáng nhớ",H/2+60,font(500,34),"#1d2a55")}
      if(s.type==="month"){center("Tháng "+(+s.m.slice(5)),H/2+20,font(800,96),th);center(s.m.slice(0,4),H/2+80,font(600,32),"#1d2a55")}
      if(s.type==="stats"){const st=yearStats();center("Một năm học của chúng mình",130,font(800,52),th);st.forEach((x,i)=>{const cx=W/2+(i%2?260:-260),cy=280+Math.floor(i/2)*190;g.textAlign="center";g.fillStyle=th;g.font=font(800,80);g.fillText(String(x[1]),cx,cy);g.fillStyle="#1d2a55";g.font=font(600,28);g.fillText(x[0],cx,cy+46)})}
      if(s.type==="end"){center(o.end||"Cảm ơn!",H/2,font(700,44),"#1d2a55");center(S.className||"",H/2+70,font(800,40),th)}}
    g.globalAlpha=1};
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  draw(0);rec.start(1000);if(src)src.start();
  const start=performance.now();
  await new Promise(res=>{const tick=()=>{const t=(performance.now()-start)/1000;if(t>=total){res();return}draw(t);
      const m=$("#vdM");if(m)m.innerHTML=`<span class="spin"></span> Đang tạo video… ${Math.round(t)}/${Math.round(total)} giây. Cô để nguyên trang này, đừng chuyển sang tab khác.`;
      setTimeout(tick,1000/FPS)};tick()});
  rec.stop();if(src)src.stop();await new Promise(r=>rec.onstop=r);if(actx)actx.close();imgs.forEach(x=>URL.revokeObjectURL(x.u));
  const ext=(rec.mimeType||mime).includes("mp4")?"mp4":"webm";const blob=new Blob(chunks,{type:ext==="mp4"?"video/mp4":"video/webm"});const url=URL.createObjectURL(blob);
  $("#vdOut").innerHTML=`<video src="${url}" controls style="width:100%;border-radius:10px;margin-top:8px"></video><div class="row" style="margin-top:8px"><button class="btn primary" id="vdDl">Tải video (.${ext})</button><span class="small muted">${ext==="webm"?"Video dạng .webm xem được trên máy tính và Facebook; muốn gửi Zalo, cô có thể đổi sang .mp4 bằng trang đổi định dạng miễn phí.":"Video .mp4 gửi được qua Zalo, Facebook."}</span></div>`;
  $("#vdDl").onclick=()=>download("Video-tong-ket-"+todayKey()+"."+ext,blob);
  S.metrics.videos=(S.metrics.videos||0)+1;save();$("#vdM").textContent="Xong! Video dài "+Math.round(total)+" giây.";
}

function weeksWithData(){const keys=Object.keys(S.ticks).filter(k=>Object.values(S.ticks[k]).some(a=>a.length)).sort();if(!keys.length)return [];
  const first=startOfWeek(fromKey(keys[0])),last=startOfWeek(new Date());const out=[];for(let d=first;d<=last&&out.length<20;d=addDays(d,7))out.push(d);return out.slice(-10)}
function impactData(){
  const wks=weeksWithData();
  const rows=wks.map(a=>{const ks=rangeKeys(dkey(a),dkey(addDays(a,6)));let khen=0,nhac=0;const praised=new Set();
    ks.forEach(k=>S.items.forEach(it=>{const l=(dayTicks(k)[it.id]||[]);if(it.kind==="khen"){khen+=l.length;l.forEach(x=>praised.add(x))}else nhac+=l.length}));
    const act=ks.reduce((t,k)=>t+(((S.metrics.dailyActive||{})[k])||0),0);const days=ks.filter(k=>(S.metrics.dailyActive||{})[k]).length;
    return {label:fmtD(a),khen,nhac,pct:S.students.length?Math.round(praised.size/S.students.length*100):0,act:days?Math.round(act/days):null}});
  const actDays=Object.values(S.metrics.dailyActive||{});const avgAct=actDays.length?Math.round(actDays.reduce((a,b)=>a+b,0)/actDays.length):null;
  const mt=S.metrics.manualTimes||[];const avgMan=mt.length?Math.round(mt.reduce((a,b)=>a+b,0)/mt.length):null;
  const sup=(S.support||[]).flatMap(p=>p.log||[]);const supC={"Tiến bộ rõ":0,"Có tiến bộ":0,"Chưa tiến bộ":0};sup.forEach(l=>{if(supC[l.lv]!=null)supC[l.lv]++});
  const asked=(S.absences||[]).reduce((t,a)=>t+Object.keys(a.done||{}).length,0);
  return {rows,avgAct,avgMan,supC,asked,abs:(S.absences||[]).length,st:statsData()}}
function svgBars(rows,series,colors,h=200,fmt=v=>v){const W=640,pl=34,pb=26,pt=14;const max=Math.max(1,...rows.flatMap(r=>series.map(s=>r[s]||0)));const nice=Math.ceil(max/5)*5||5;
  const bw=(W-pl-10)/Math.max(1,rows.length),gw=Math.min(bw*.7/series.length,46);let g=`<svg viewBox="0 0 ${W} ${h}" class="chart" role="img">`;
  for(let i=0;i<=5;i++){const y=pt+(h-pt-pb)*(1-i/5);g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${fmt(Math.round(nice*i/5))}</text>`}
  rows.forEach((r,i)=>{const x0=pl+i*bw+(bw-gw*series.length)/2;series.forEach((s,j)=>{const v=r[s]||0;const bh=(h-pt-pb)*v/nice;g+=`<rect x="${x0+j*gw}" y="${h-pb-bh}" width="${gw-2}" height="${bh}" rx="3" fill="${colors[j]}"><title>${r.label}: ${v}</title></rect>`});
    g+=`<text x="${pl+i*bw+bw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${r.label}</text>`});return g+"</svg>"}
function svgLine(rows,key,color,h=180){const W=640,pl=34,pb=26,pt=14;const n=rows.length;let g=`<svg viewBox="0 0 ${W} ${h}" class="chart" role="img">`;
  for(let i=0;i<=4;i++){const y=pt+(h-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-soft)">${i*25}%</text>`}
  const X=i=>pl+((W-pl-20)*(n<2?.5:i/(n-1)))+5,Y=v=>pt+(h-pt-pb)*(1-v/100);
  if(n){g+=`<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${rows.map((r,i)=>X(i)+","+Y(r[key])).join(" ")}"/>`;rows.forEach((r,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(r[key])}" r="${i===n-1?5:3.5}" fill="${color}"><title>${r.label}: ${r[key]}%</title></circle><text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${r.label}</text>`});
    const l=rows[n-1];g+=`<text x="${X(n-1)}" y="${Y(l[key])-10}" text-anchor="middle" font-size="12" font-weight="700" fill="${color}">${l[key]}%</text>`}
  return g+"</svg>"}

   ${D.avgAct!=null&&D.avgMan!=null?`<h3>Thời gian làm nhận xét cả lớp (giây)</h3>${svgBars([{label:"Viết tay",v:D.avgMan},{label:"Dùng sổ",v:D.avgAct}],["v"],[acc],170)}`:""}

   ${Object.values(D.supC).some(Boolean)?`<h3>Tiến bộ của học sinh được hỗ trợ (số lượt ghi nhận hằng tuần)</h3>${svgBars(Object.entries(D.supC).map(([k,v])=>({label:k,v})),["v"],[good],170)}`:""}
  </div>`}

/* ================= KHÓA SỔ BẰNG MÃ PIN ================= */
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "x"+h}}
const hasPin=()=>!!(CONFIG.pro&&S.settings.pinHash);
let locked=false;
function lockNow(){if(!hasPin())return;locked=true;const r=document.getElementById("lockRoot");
  r.innerHTML=`<div class="lock"><div class="lockbox"><span class="logo" aria-hidden="true">${esc(CONFIG.logo)}</span><h2>${esc(CONFIG.title)}</h2><p class="small muted">Sổ đang khóa để bảo vệ thông tin học sinh.</p>
   <input type="password" inputmode="numeric" autocomplete="off" id="pinIn" maxlength="8" placeholder="Nhập mã PIN" aria-label="Mã PIN"><button class="btn primary" id="pinGo">Mở sổ</button><span class="small neg" id="pinM"></span>
   <button class="btn ghost sm" id="pinForgot">Quên mã PIN?</button><div id="pinF" hidden class="small"><p>Mã PIN không khôi phục được. Cách duy nhất là xóa toàn bộ dữ liệu sổ trên máy này (nên có bản sao lưu). Gõ <b>XOA DU LIEU</b> rồi bấm Xóa.</p><div class="row"><input type="text" id="pinW" style="flex:1"><button class="btn danger" id="pinWipe">Xóa</button></div></div></div></div>`;
  const go=async()=>{const v=$("#pinIn").value.trim();if(await sha(S.settings.pinSalt+v)===S.settings.pinHash){locked=false;r.innerHTML="";lastAct=Date.now()}else{$("#pinM").textContent="Mã PIN chưa đúng.";$("#pinIn").value=""}};
  $("#pinGo").onclick=go;$("#pinIn").onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>{const i=$("#pinIn");i&&i.focus()},50);
  $("#pinForgot").onclick=()=>{$("#pinF").hidden=false};
  $("#pinWipe").onclick=async()=>{if($("#pinW").value.trim().toUpperCase()!=="XOA DU LIEU")return;try{localStorage.removeItem(STORE);indexedDB.deleteDatabase(STORE+"-album")}catch(e){}location.reload()}}
setInterval(()=>{if(hasPin()&&!locked&&S.settings.lockMin&&Date.now()-lastAct>S.settings.lockMin*60000)lockNow()},20000);

/* ================= MÃ QR ================= */
function siteUrl(){return /^https?:/.test(location.protocol)&&!/claude/.test(location.host)?location.origin+location.pathname.replace(/index\.html$/,""):CONFIG.siteUrl}
function loadQR(){return new Promise((res,rej)=>{if(window.qrcode)return res();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";s.onload=res;s.onerror=()=>rej(new Error("Cần có mạng để tạo mã QR."));document.head.appendChild(s)})}
async function drawQR(cv,text){await loadQR();const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),sc=8,m=4;cv.width=cv.height=(n+m*2)*sc;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.fillStyle="#111";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+m)*sc,(r+m)*sc,sc,sc)}

/* ================= SỐ LIỆU ================= */
const secT=s=>s==null?"—":s>=60?Math.floor(s/60)+" phút "+(s%60)+" giây":s+" giây";
function statsData(){
  const days=Object.keys(S.ticks).filter(k=>Object.values(S.ticks[k]).some(a=>a.length));
  let ticks=0,khen=0,nhac=0;days.forEach(k=>S.items.forEach(it=>{const n=(S.ticks[k][it.id]||[]).length;ticks+=n;it.kind==="khen"?khen+=n:nhac+=n}));
  const ex=S.metrics.exports||[];const excel=ex.filter(e=>e.kind==="excel");
  const comments=days.length*S.students.length;

/* Đọc danh sách lớp từ Excel: tìm dòng tiêu đề cột, hỗ trợ cột Họ / Tên tách rời, ô gộp, nhiều trang */
function readClassSheet(wb){
  const norm=v=>String(v==null?"":v).normalize("NFC").replace(/\s+/g," ").trim();const low=v=>norm(v).toLowerCase();
  const isNameHead=c=>/^(họ (và|&) tên|họ tên|ho va ten|ho ten|họ và tên học sinh|tên học sinh)/.test(low(c));
  let best={list:[]};
  wb.SheetNames.forEach(sn=>{const ws=wb.Sheets[sn];
    const ks=Object.keys(ws).filter(k=>k[0]!=="!");if(!ks.length)return;let mr=0,mc=0;ks.forEach(k=>{const d=XLSX.utils.decode_cell(k);if(d.r>mr)mr=d.r;if(d.c>mc)mc=d.c});ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});
    const R=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false,blankrows:true});
    // dòng tiêu đề = dòng có ô (ngắn) là "Họ và tên"/"Họ"+"Tên" và có ít nhất 2 ô có chữ
    let h=-1,cN=-1,cF=-1;
    for(let i=0;i<Math.min(R.length,30)&&h<0;i++){const row=R[i];const filled=row.filter(c=>norm(c)).length;if(filled<2)continue;
      const jh=row.findIndex(c=>/^họ( và tên đệm| và đệm| tên đệm| đệm| lót| và tên lót)?$/.test(low(c)));const jt=row.findIndex(c=>/^tên$/.test(low(c)));if(jh>=0&&jt>=0){h=i;cN=jh;cF=jt;break}
      const j=row.findIndex(c=>isNameHead(c)&&norm(c).length<40);if(j>=0){h=i;cN=j;break}}
    if(h<0)return;
    const head=R[h].map(low);const col=re=>head.findIndex(c=>re.test(c));
    const cG=col(/^tổ|^nhóm/),cK=col(/tên gọi|biệt danh/),cP=col(/sđt|điện thoại|phone|số đt/);
    const data=R.slice(h+1);
    // ô gộp "Họ và tên" trên 2 cột: cột bên phải không có tiêu đề và chứa tên (1 chữ)
    if(cF<0&&cN+1<head.length&&!head[cN+1]){const vals=data.map(r=>norm(r[cN+1])).filter(Boolean);if(vals.length&&vals.filter(v=>!/\d/.test(v)&&v.split(" ").length<=2).length/vals.length>.7)cF=cN+1}
    const list=[];
    data.forEach(row=>{let n=norm(row[cN]);if(cF>=0&&norm(row[cF]))n=(n+" "+norm(row[cF])).trim();if(!n||/^\d+([.,]\d+)?$/.test(n)||isNameHead(n))return;
      if(/^(tổng|cộng|danh sách|giáo viên|gvcn|người lập)/i.test(n))return;
      list.push({n,g:cG>=0?norm(row[cG]).replace(/^tổ\s*/i,""):"",k:cK>=0?norm(row[cK]):"",p:cP>=0?norm(row[cP]):""})});
    if(list.length>best.list.length)best={list,sheet:wb.SheetNames.length>1?sn:""}});
  return best}

/* ================= khởi động ================= */
/* Link bật AI: ...#ai=MÃ — lưu mã vào máy rồi xóa khỏi thanh địa chỉ */
try{const m=location.hash.match(/^#ai=([A-Za-z0-9_\-.]{20,})$/);if(m){S.settings.key=m[1];S.settings.model="";save();history.replaceState(null,"",location.pathname+location.search);setTimeout(()=>toast("Đã bật AI cho máy này. Từ giờ bấm các nút AI là dùng được ngay."),300)}}catch(e){}
if(CONFIG.layout==="side")document.body.classList.add("side");
if(CONFIG.compact){document.body.classList.add("compact");const hb=$("#hdrHelp");hb.hidden=false;let on=false;try{on=localStorage.getItem(STORE+"-help")==="1"}catch(e){}
  const ap=()=>{document.body.classList.toggle("showhelp",on);hb.setAttribute("aria-pressed",String(on));hb.textContent=on?"Ẩn hướng dẫn":"Hiện hướng dẫn"};ap();hb.onclick=()=>{on=!on;try{localStorage.setItem(STORE+"-help",on?"1":"0")}catch(e){}ap()}}
let start="today";try{start=localStorage.getItem(STORE+"-tab")||"today"}catch(e){}
if(!TABS.some(t=>t[0]===start))start="today";
show(start);
if(CONFIG.pro&&hasPin())lockNow();else if(CONFIG.pro){let seen=false;try{seen=localStorage.getItem(STORE+"-intro")==="1"}catch(e){}if(!seen)setTimeout(openIntro,300)}
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|claudeusercontent/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body></html>
